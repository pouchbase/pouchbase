<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Error %sveltekit.status% · Pouchbase</title>
		<!-- Shown when the error page itself fails, so it can't use the site's styles or components. -->
		<style>
			body {
				margin: 0;
				min-height: 100svh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 3rem 1.5rem;
				box-sizing: border-box;
				background: #fff;
				color: #09090b;
				font-family: ui-sans-serif, system-ui, sans-serif;
				text-align: center;
			}
			main {
				max-width: 36rem;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 1rem;
			}
			.status {
				margin: 0;
				font-size: 5rem;
				line-height: 1;
				font-weight: 600;
				color: #f6821f;
			}
			h1 {
				margin: 0;
				font-size: 1.875rem;
				font-weight: 600;
			}
			p {
				margin: 0;
				color: #52525b;
				line-height: 1.6;
			}
			a {
				margin-top: 0.5rem;
				padding: 0.5rem 1rem;
				border-radius: 0.5rem;
				background: #f6821f;
				color: #fff;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<main role="alert">
			<p class="status">%sveltekit.status%</p>
			<h1>Something went wrong</h1>
			<p>%sveltekit.error.message%</p>
			<a href="/">Back to the home page</a>
		</main>
	</body>
</html>
