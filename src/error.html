<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Error %sveltekit.status% · Pouchbase</title>
		<!--
			Shown when the error page itself fails (or a hook throws), so it can't use the app's styles
			or components. Follows the theme picked in the dashboard (the `pouchbase-theme` cookie,
			see `hooks/theme.ts`) or else the system, with the colours of `@pouchbasejs/ui/theme.css`.
		-->
		<script>
			const theme = document.cookie.match(/(?:^|; )pouchbase-theme=(light|dark)(?:;|$)/)?.[1];

			if (theme) {
				document.documentElement.setAttribute('data-theme', theme);
			}
		</script>
		<style>
			:root {
				color-scheme: light;
				--background: #fff;
				--foreground: #18181b;
				--muted: #71717a;
				--secondary: #52525b;
			}
			:root[data-theme='dark'] {
				color-scheme: dark;
				--background: #111114;
				--foreground: #eeeef0;
				--muted: #8b8b95;
				--secondary: #a7a7b0;
			}
			@media (prefers-color-scheme: dark) {
				:root:not([data-theme='light']) {
					color-scheme: dark;
					--background: #111114;
					--foreground: #eeeef0;
					--muted: #8b8b95;
					--secondary: #a7a7b0;
				}
			}
			body {
				margin: 0;
				min-height: 100svh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 3rem 1rem;
				box-sizing: border-box;
				background: var(--background);
				color: var(--foreground);
				font-family: ui-sans-serif, system-ui, sans-serif;
			}
			main {
				width: 100%;
				max-width: 32rem;
				display: flex;
				flex-direction: column;
				gap: 0.75rem;
			}
			.status {
				margin: 0;
				font-family: ui-monospace, monospace;
				font-size: 0.75rem;
				color: var(--muted);
			}
			h1 {
				margin: 0;
				font-size: 1.25rem;
				font-weight: 600;
			}
			p {
				margin: 0;
				font-size: 0.875rem;
				color: var(--secondary);
			}
			a {
				align-self: flex-start;
				margin-top: 0.5rem;
				padding: 0.375rem 0.75rem;
				border-radius: 0.375rem;
				background: var(--foreground);
				color: var(--background);
				font-size: 0.875rem;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<main role="alert">
			<p class="status">Error %sveltekit.status%</p>
			<h1>Something went wrong</h1>
			<p>%sveltekit.error.message%</p>
			<p>Pouchbase could not show this page. Reload it, or try again in a moment.</p>
			<a href="/">Go to the dashboard</a>
		</main>
	</body>
</html>
