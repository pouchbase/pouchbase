<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Error %sveltekit.status% · Pouchbase</title>
		<!-- Shown when the error page itself fails, so it can't use the app's styles or components. -->
		<style>
			body {
				margin: 0;
				min-height: 100svh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 3rem 1rem;
				box-sizing: border-box;
				background: #fff;
				color: #18181b;
				font-family: ui-sans-serif, system-ui, sans-serif;
			}
			main {
				width: 100%;
				max-width: 32rem;
				display: flex;
				flex-direction: column;
				gap: 0.75rem;
			}
			.status {
				margin: 0;
				font-family: ui-monospace, monospace;
				font-size: 0.75rem;
				color: #71717a;
			}
			h1 {
				margin: 0;
				font-size: 1.25rem;
				font-weight: 600;
			}
			p {
				margin: 0;
				font-size: 0.875rem;
				color: #52525b;
			}
			a {
				align-self: flex-start;
				margin-top: 0.5rem;
				padding: 0.375rem 0.75rem;
				border-radius: 0.375rem;
				background: #18181b;
				color: #fff;
				font-size: 0.875rem;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<main role="alert">
			<p class="status">Error %sveltekit.status%</p>
			<h1>Something went wrong</h1>
			<p>%sveltekit.error.message%</p>
			<p>Pouchbase could not show this page. Reload it, or try again in a moment.</p>
			<a href="/">Go to the dashboard</a>
		</main>
	</body>
</html>
